<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#198754">
    <title>Mini-Sheet PWA</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="d-flex flex-column vh-100 overflow-hidden bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-success px-3 py-1 shadow-sm">
        <span class="navbar-brand fw-bold mb-0 h6">📊 Mini-Sheet PWA (100×100)</span>
        <div class="d-flex gap-2">
            <button id="btn-install" class="btn btn-warning btn-sm d-none">Installa App</button>
            <button id="btn-export-csv" class="btn btn-outline-light btn-sm">Esporta CSV</button>
            <button id="btn-clear" class="btn btn-outline-light btn-sm">Pulisci</button>
        </div>
    </nav>

    <!-- Barra della formula -->
    <div class="input-group input-group-sm border-bottom bg-white p-1">
        <span id="active-cell-badge" class="input-group-text fw-bold bg-light justify-content-center" style="min-width: 60px;">A1</span>
        <span class="input-group-text bg-white text-muted fst-italic">fx</span>
        <input id="formula-input" type="text" class="form-control font-monospace" placeholder="Inserisci valore o formula (es. =SOMMA(A1:A5))">
    </div>

    <!-- Viewport virtualizzato -->
    <main id="grid-viewport" class="flex-grow-1 position-relative overflow-auto bg-white">
        <div id="grid-spacer" class="position-relative">
            <div class="corner-header"></div>
            <div id="col-headers-layer" class="sticky-top-layer"></div>
            <div id="row-headers-layer" class="sticky-left-layer"></div>
            <div id="cells-layer"></div>
            <input id="cell-editor" type="text" class="cell-editor font-monospace">
        </div>
    </main>

    <script src="./js/coordinates.js"></script>
    <script src="./js/engine.js"></script>
    <script src="./js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker registrato'))
                    .catch(err => console.error('Errore SW:', err));
            });
        }
        let deferredPrompt;
        const installBtn = document.getElementById('btn-install');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('d-none');
        });
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBtn.classList.add('d-none');
        });
    </script>
</body>
</html>
